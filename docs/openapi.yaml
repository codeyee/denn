      - BearerAuth: []
      summary: Get movie details
      tags:
      - Movies
  /movies/bulk:
    get:
      description: Fetches full details for up to 50 movies in parallel. Failed IDs
        are silently omitted.
      parameters:
      - description: Comma-separated TMDB movie IDs (max 50)
        example: 550,603,680
        in: query
        name: ids
        required: true
        type: string
      - description: ISO 3166-1 alpha-2 country code for platform availability (default
