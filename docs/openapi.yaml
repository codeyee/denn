      results:
        items:
          $ref: '#/definitions/models.SearchItem'
        type: array
    type: object
  multisearch.MultiSearchResponse:
    properties:
      albums:
        $ref: '#/definitions/multisearch.ContentResult'
      books:
        $ref: '#/definitions/multisearch.ContentResult'
      games:
        $ref: '#/definitions/multisearch.ContentResult'
      movies:
        $ref: '#/definitions/multisearch.ContentResult'
      tv_shows:
        $ref: '#/definitions/multisearch.ContentResult'
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    REST API proxy that aggregates metadata from TMDB, IGDB, Spotify, and OpenLibrary.
    Authentication: send API key via X-Api-Key header or Authorization: Bearer <token>.
    Rate limit: 60 requests/minute on protected endpoints.
  title: Denn Proxy API
  version: "1.0"
paths:
  /albums/{id}:
    get:
      parameters:
      - description: Spotify album ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AlbumResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Get album details
      tags:
      - Albums
  /albums/bulk:
    get:
      description: Fetches full details for up to 20 albums in parallel. Album IDs
        are Spotify string IDs. Failed IDs are silently omitted.
      parameters:
      - description: Comma-separated Spotify album IDs (max 20)
        example: 5K79FLRUCSysQnVESLcTdb,3RQQmkQEvNCY4prGKE6oc5
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AlbumResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Get multiple albums by ID
      tags:
      - Albums
  /albums/search:
    get:
      description: Singles are excluded from results (only albums and EPs are returned).
      parameters:
      - description: Search term
        in: query
        name: query
        required: true
        type: string
      - default: 1
        description: Page number (min 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Results per page (max 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.PaginatedSearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Search albums
      tags:
      - Albums
  /albums/trending:
    get:
      description: Sourced from Spotify Charts.
      parameters:
      - default: 1
        description: Page number (min 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Results per page (max 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.PaginatedSearchResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Get trending albums
      tags:
      - Albums
  /books/{id}:
    get:
      parameters:
      - description: OpenLibrary work ID (e.g. OL27448W)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Get book details
      tags:
      - Books
  /books/bulk:
    get:
      description: Fetches full details for up to 20 books in parallel. Book IDs are
        OpenLibrary work IDs (e.g. OL27448W). Failed IDs are silently omitted.
      parameters:
      - description: Comma-separated OpenLibrary work IDs (max 20)
        example: OL27448W,OL82563W
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BookResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Get multiple books by ID
      tags:
      - Books
  /books/search:
    get:
      parameters:
      - description: Search term
        in: query
        name: query
        required: true
        type: string
      - default: 1
        description: Page number (min 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Results per page (max 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.PaginatedSearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Search books
      tags:
      - Books
  /books/trending:
    get:
      description: Sourced from OpenLibrary bestsellers with client-side pagination.
      parameters:
      - default: 1
        description: Page number (min 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Results per page (max 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.PaginatedSearchResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Get trending books
      tags:
      - Books
  /games/{id}:
    get:
      parameters:
      - description: IGDB game ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GameResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Get game details
      tags:
      - Games
  /games/bulk:
    get:
      description: Fetches full details for up to 50 games in parallel.
      parameters:
      - description: Comma-separated IGDB game IDs (max 50)
        example: 7346,1020
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.GameResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Get multiple games by ID
      tags:
      - Games
  /games/search:
    get:
      description: 'Searches via IGDB. Note: total_pages and total_results are always
        0 (IGDB limitation).'
      parameters:
      - description: Search term
        in: query
        name: query
        required: true
        type: string
      - default: 1
        description: Page number (min 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Results per page (max 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.PaginatedSearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Search games
      tags:
      - Games
  /games/trending:
    get:
      description: 'Custom trending algorithm: 70% want-to-play + 30% visits, with
        recency multiplier (up to 4x). Browser-only games excluded. total_pages and
        total_results are always 0.'
      parameters:
      - default: 1
        description: Page number (min 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Results per page (max 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.PaginatedSearchResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Get trending games
      tags:
      - Games
  /health:
    get:
      description: Public endpoint — no authentication required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.HealthResponse'
      summary: Health check
      tags:
      - Health
  /homepage:
    get:
      description: 'Two-phase parallel fan-out: (1) fetch trending/popular from all
        5 services, (2) enrich with full detail objects. Returns MovieResponse, TVShowResponse,
        GameResponse, AlbumResponse, BookResponse objects preserving trending order.
        Country is read from the X-User-Country header.'
      parameters:
      - default: 1
        description: Page number (min 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Results per page (max 50)
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: ISO 3166-1 alpha-2 country code for platform availability (default
          US)
        in: header
        name: X-User-Country
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/homepage.HomepageResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      security:
      - ApiKeyHeader: []
      - BearerAuth: []
      summary: Homepage — trending content with full detail enrichment
      tags:
      - Aggregate
  /movies/{id}:
    get:
      parameters:
      - description: TMDB movie ID
        in: path
        name: id
        required: true
        type: integer
      - description: ISO 3166-1 alpha-2 country code for platform availability (default
          US)
        in: header
        name: X-User-Country
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MovieResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/common.ErrorResponse'
