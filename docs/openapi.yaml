openapi: 3.0.0
info:
  title: Denn Proxy API
  description: API Gateway and Proxy for Movies, TV Shows, Games, Music, and Books.
  version: 1.0.0
servers:
  - url: http://localhost:8080/proxy/v1
    description: Local Development Server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    PaginationMetadata:
      type: object
      properties:
        page:
          type: integer
        total_pages:
          type: integer
        total_results:
          type: integer
    Movie:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        overview:
          type: string
        release_date:
          type: string
        poster_path:
          type: string
    TVShow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        overview:
          type: string
        first_air_date:
          type: string
        poster_path:
          type: string

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      summary: Health Check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pass

  /movies/search:
    get:
      summary: Search Movies
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests

  /movies/trending:
    get:
      summary: Get Trending Movies
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Trending movies

  /movies/{id}:
    get:
      summary: Get Movie Details
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Movie details
        '404':
          description: Movie not found

  /tv_shows/search:
    get:
      summary: Search TV Shows
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results

  /tv_shows/{id}:
    get:
      summary: Get TV Show Details
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: TV Show details

  /games/search:
    get:
      summary: Search Games
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Search results

  /albums/search:
    get:
      summary: Search Albums
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Search results

  /books/search:
    get:
      summary: Search Books
      parameters:
        - in: query
          name: query
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Search results
