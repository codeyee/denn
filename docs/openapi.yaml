        type: array
      release_date:
        type: string
      title:
        type: string
      total_tracks:
        type: integer
      tracks:
        items:
          $ref: '#/definitions/models.Track'
        type: array
      type:
        type: string
    type: object
  models.Author:
    properties:
      name:
        type: string
      type:
        type: string
    type: object
  models.BookResponse:
    properties:
      authors:
        items:
          $ref: '#/definitions/models.Author'
        type: array
      description:
        type: string
      id:
        type: string
      image_url:
        type: string
      images:
        items:
          $ref: '#/definitions/models.ImageEntry'
        type: array
      pages:
        type: integer
      release_date:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  models.Episode:
    properties:
      description:
        type: string
      duration_minutes:
        type: integer
      episode_number:
        type: integer
      episode_type:
        type: string
      id:
        type: string
      image_url:
        type: string
      release_date:
        type: string
      season_number:
        type: integer
      title:
        type: string
    type: object
  models.GameResponse:
    properties:
      authors:
        items:
          $ref: '#/definitions/models.Author'
        type: array
      description:
        type: string
      game_modes:
        items:
          type: string
        type: array
      game_type:
        type: string
      genres:
        items:
          type: string
        type: array
      id:
        type: string
      image_url:
        type: string
      images:
        items:
          $ref: '#/definitions/models.ImageEntry'
        type: array
      platforms:
        items:
          $ref: '#/definitions/models.Platform'
        type: array
      play_time:
        $ref: '#/definitions/models.PlayTime'
      release_date:
        type: string
      series:
        type: string
      themes:
        items:
          type: string
        type: array
      title:
        type: string
      type:
        type: string
