name: Monorepo CI

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      core: ${{ steps.filter.outputs.core }}
      proxy: ${{ steps.filter.outputs.proxy }}
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
            core:
              - 'core/**'
            proxy:
              - 'proxy/**'
            workspace:
              - '.github/workflows/**'
              - '.docs/**'
              - '.scripts/**'
              - 'Makefile'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - '.gitignore'

  validate-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run build
        run: pnpm run build

  validate-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-placeholder-secret
        run: python manage.py test

  validate-proxy:
    needs: detect-changes
    if: needs.detect-changes.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: proxy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proxy/go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  validate-workspace:
    needs: detect-changes
    if: needs.detect-changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workspace files
        run: |
          test -f README.md
          test -f Makefile
          test -f .docs/workspace-operating-model.md
          test -f .scripts/workspace.sh

  ci-summary:
    needs:
      - detect-changes
      - validate-web
      - validate-core
      - validate-proxy
      - validate-workspace
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check required job results
        env:
          WEB_RESULT: ${{ needs.validate-web.result }}
          CORE_RESULT: ${{ needs.validate-core.result }}
          PROXY_RESULT: ${{ needs.validate-proxy.result }}
          WORKSPACE_RESULT: ${{ needs.validate-workspace.result }}
        run: |
          for result in "$WEB_RESULT" "$CORE_RESULT" "$PROXY_RESULT" "$WORKSPACE_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required validation job failed: $result"
              exit 1
            fi
          done
