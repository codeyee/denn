name: Monorepo CI

on:
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      core: ${{ steps.filter.outputs.core }}
      proxy: ${{ steps.filter.outputs.proxy }}
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        with:
          filters: |
            web:
              - 'web/**'
            core:
              - 'core/**'
            proxy:
              - 'proxy/**'
            workspace:
              - '.docker/**'
              - '.github/workflows/**'
              - '.docs/**'
              - '.scripts/**'
              - 'AGENTS.md'
              - 'compose.local.yml'
              - 'Makefile'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - '.gitignore'

  validate-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.6.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run build
        run: pnpm run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run deterministic production-build browser smoke
        run: pnpm exec playwright test --project=smoke-desktop

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-smoke
          path: |
            web/test-results/artifacts
            web/test-results/report
          if-no-files-found: ignore
          retention-days: 14

  validate-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-placeholder-secret
        run: python manage.py test

  validate-proxy:
    needs: detect-changes
    if: needs.detect-changes.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: proxy
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: proxy/go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  validate-workspace:
    needs: detect-changes
    if: needs.detect-changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate workspace files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f Makefile
          test -f compose.local.yml
          test -f .docs/workspace-operating-model.md
          test -f .docs/runbooks/local-development.md
          test -f .scripts/workspace.sh
          test -f web/.env.example
          bash -n .scripts/workspace.sh

  ci-summary:
    needs:
      - detect-changes
      - validate-web
      - validate-core
      - validate-proxy
      - validate-workspace
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check required job results
        env:
          WEB_RESULT: ${{ needs.validate-web.result }}
          CORE_RESULT: ${{ needs.validate-core.result }}
          PROXY_RESULT: ${{ needs.validate-proxy.result }}
          WORKSPACE_RESULT: ${{ needs.validate-workspace.result }}
        run: |
          for result in "$WEB_RESULT" "$CORE_RESULT" "$PROXY_RESULT" "$WORKSPACE_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required validation job failed: $result"
              exit 1
            fi
          done
