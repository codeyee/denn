name: Deploy Core

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/deploy-core.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/codeyee/denn-core

concurrency:
  group: deploy-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: core/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-placeholder-secret
        run: python manage.py test

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./core
          file: ./core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Wait for matching web release
        if: success() && env.DEPLOY_WEBHOOK != ''
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEPLOY_WEBHOOK: ${{ secrets.CORE_DEPLOY_WEBHOOK }}
          WEB_PUBLIC_URL: ${{ vars.WEB_PUBLIC_URL || 'https://denn.codeyee.dev' }}
        run: |
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- web/; then
            echo "No web changes in this push; core can deploy independently."
            exit 0
          fi

          version_url="${WEB_PUBLIC_URL%/}/api/version"
          for attempt in $(seq 1 90); do
            deployed_payload="$(
              curl --fail --silent --show-error \
                --max-time 5 \
                "$version_url" 2>/dev/null || true
            )"
            deployed_sha="$(
              printf '%s' "$deployed_payload" |
                sed -n 's/.*"sha":"\([0-9a-f]\{40\}\)".*/\1/p'
            )"
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Web release $GITHUB_SHA is live; core deployment may continue."
              exit 0
            fi
            echo "Waiting for web release $GITHUB_SHA (attempt $attempt/90)."
            sleep 10
          done

          echo "Timed out waiting for web release $GITHUB_SHA at $version_url."
          exit 1

      - name: Deploy via webhook
        if: success() && env.DEPLOY_WEBHOOK != ''
        run: curl -fsSL "${{ secrets.CORE_DEPLOY_WEBHOOK }}"
        env:
          DEPLOY_WEBHOOK: ${{ secrets.CORE_DEPLOY_WEBHOOK }}
